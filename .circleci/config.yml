version: 2.1

# Every branch: test. Non-main: build (Dockerfile check). main:
#   test -> hold-bootstrap (approval) -> bootstrap   provision app/volume, stage secrets (idempotent)
#   test -> hold (approval)           -> deploy      remote build, deploy, /healthz smoke
# Rollback: trigger a pipeline on main with parameter rollback_image (see DEPLOY.md).
# Fly builds the image remotely on deploy, so main is never built twice.
# Contexts are attached only to main-filtered jobs: fork PRs never see them.

parameters:
  rollback_image:
    type: string
    default: ""
    description: "registry.fly.io/<app>:<tag> from 'fly releases --image'. Non-empty = rollback workflow only."

# Images pinned by multi-arch index digest (resolved 2026-10-22). Bump tag + digest together.
executors:
  python:
    docker:
      - image: cimg/python:3.12.15@sha256:d0177be857b2c8492d9d655f082bd32b6d02cc4cb7497abb99f8f2d66064fc29
  base:
    docker:
      - image: cimg/base:2026.10@sha256:e133b1e03b06cafa4a66dbe6bdb350e6ed7133729b1a4f812635b82c6e1e5389

commands:
  install-flyctl:
    description: Install a pinned flyctl release into ~/bin, sha256 verified.
    steps:
      - run:
          name: Install flyctl (pinned release, sha256 verified)
          environment:
            FLYCTL_VERSION: "0.4.120"
            FLYCTL_SHA256: "ef9b938ff3af2b28fad961a676e5ac2295124ad0b892ffb1c5f16a03bd4ee378"
          command: |
            set -euo pipefail
            tarball="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
            curl -fsSL -o "/tmp/${tarball}" \
              "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${tarball}"
            echo "${FLYCTL_SHA256}  /tmp/${tarball}" | sha256sum -c -
            mkdir -p "$HOME/bin"
            tar -xzf "/tmp/${tarball}" -C "$HOME/bin" flyctl
            "$HOME/bin/flyctl" version

jobs:
  test:
    executor: python
    steps:
      - checkout
      - run:
          name: Secret scan (gitleaks, pinned release, sha256 verified)
          environment:
            GITLEAKS_VERSION: "8.30.1"
            GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          # Scans every commit reachable from this branch. Fails the job on any finding.
          # Allow-list a false positive with a commented .gitleaksignore entry (fingerprint), never by
          # disabling the step.
          command: |
            set -euo pipefail
            tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -fsSL -o "/tmp/${tarball}" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
            echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
            mkdir -p "$HOME/bin"
            tar -xzf "/tmp/${tarball}" -C "$HOME/bin" gitleaks
            "$HOME/bin/gitleaks" git . --redact --no-banner
      - restore_cache:
          keys:
            - pip-v3-{{ checksum "requirements-dev.lock" }}
      - run:
          name: Install locked deps with hashes (runtime deps + ruff)
          # Same pins as the image (requirements.lock) plus ruff. Tests import chatbot from the
          # checkout, like the image runs it from /app.
          command: pip install --require-hashes --no-deps -r requirements-dev.lock
      - save_cache:
          key: pip-v3-{{ checksum "requirements-dev.lock" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Lock matches pyproject.toml (regenerate the locks if this fails, see DEPLOY.md)
          command: |
            python - \<<'EOF'
            import tomllib
            from importlib.metadata import PackageNotFoundError, version
            from pip._vendor.packaging.requirements import Requirement
            p = tomllib.load(open("pyproject.toml", "rb"))["project"]
            bad = []
            for spec in p["dependencies"] + p["optional-dependencies"]["dev"]:
                r = Requirement(spec)
                try:
                    v = version(r.name)
                except PackageNotFoundError:
                    v = None
                if v is None or not r.specifier.contains(v, prereleases=True):
                    bad.append(f"{spec} (installed: {v})")
            if bad:
                raise SystemExit("requirements locks are stale: " + ", ".join(bad))
            print("locks satisfy pyproject.toml")
            EOF
      - run:
          name: Ruff format check
          command: ruff format --check .
      - run:
          name: Ruff lint
          command: ruff check .
      - run:
          name: Unit tests
          # Tests must not need real keys; nothing secret is available in this job.
          command: python -m unittest discover tests -v

  build:
    executor: base
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image (validation only, not pushed)
          command: docker build --pull -t simple-chatbot:ci .

  bootstrap:
    # Contexts: fly-bootstrap (FLY_API_TOKEN = org token, FLY_ORG) + app-secrets (app secrets).
    executor: base
    steps:
      - checkout
      - install-flyctl
      - run:
          name: Provision Fly app, volume, snapshot retention, secrets (idempotent)
          command: deploy/bootstrap.sh

  deploy:
    # Context: fly-deploy (FLY_API_TOKEN = app-scoped deploy token).
    executor: base
    steps:
      - checkout
      - install-flyctl
      - run:
          name: Deploy to Fly.io (remote build) and smoke check /healthz
          command: deploy/deploy.sh

  rollback:
    # Context: fly-deploy. Redeploys an earlier image; data on the volume is not rolled back.
    executor: base
    environment:
      # Passed as env, never interpolated into the shell command; deploy.sh validates the format.
      ROLLBACK_IMAGE: << pipeline.parameters.rollback_image >>
    steps:
      - checkout
      - install-flyctl
      - run:
          name: Show releases, redeploy the requested image, smoke check
          command: deploy/deploy.sh "$ROLLBACK_IMAGE"

workflows:
  test-build-deploy:
    when:
      not: << pipeline.parameters.rollback_image >>
    jobs:
      - test
      - build:
          requires: [test]
          filters:
            branches:
              ignore: main
      - hold-bootstrap:
          type: approval
          requires: [test]
          filters:
            branches:
              only: main
      - bootstrap:
          requires: [hold-bootstrap]
          context: [fly-bootstrap, app-secrets]
          # One Fly mutation at a time across pipelines (no duplicate volume, no deploy mid-bootstrap).
          serial-group: << pipeline.project.slug >>/fly
          filters:
            branches:
              only: main
      - hold:
          type: approval
          requires: [test]
          filters:
            branches:
              only: main
      - deploy:
          requires: [hold]
          context: fly-deploy
          serial-group: << pipeline.project.slug >>/fly
          filters:
            branches:
              only: main

  rollback:
    when: << pipeline.parameters.rollback_image >>
    jobs:
      - hold-rollback:
          type: approval
          filters:
            branches:
              only: main
      - rollback:
          requires: [hold-rollback]
          context: fly-deploy
          serial-group: << pipeline.project.slug >>/fly
          filters:
            branches:
              only: main
