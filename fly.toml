# Fly.io config and the single source of truth for the CircleCI bootstrap/deploy jobs
# (deploy/common.sh reads app, primary_region and [mounts]). No secrets here: they come from
# the CircleCI context app-secrets via the bootstrap job (see DEPLOY.md).
# app must equal FLY_APP in context fly-bootstrap: bootstrap refuses to run otherwise.
app = "<YOUR_FLY_APP>"
primary_region = "<YOUR_REGION>"  # e.g. gru, iad, fra — must match the volume's region

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DB_PATH = "/data/chatbot.db"
  CALL_LOG_PATH = "/data/logs/calls.jsonl"
  LLM_MODEL = "openai/gpt-4.1-mini"
  # Required: the server rejects unknown Host headers. Comma-separated, no scheme.
  ALLOWED_HOSTS = "<YOUR_FLY_APP>.fly.dev"
  MAX_INPUT_TOKENS = "8000"
  TARGET_INPUT_TOKENS = "6500"
  # Salience gate before fact extraction (see DEPLOY.md "Salience gate"). GATE_MODEL = "" turns it off.
  # Do not set JUDGE_MODEL to a jev model: those are decisions-only and fail on chat/completions.
  GATE_MODEL = "typesafe/jev-1.14"
  GATE_THRESHOLD = "0.3"

# SQLite + one volume => exactly ONE machine. Never scale above 1.
[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1gb"  # bootstrap creates the volume with this size
  # Snapshots keep forgotten data until they expire (see DEPLOY.md "Forget and backups").
  # bootstrap applies this with `fly volumes update --snapshot-retention`.
  snapshot_retention = 1

[http_service]
  internal_port = 8080
  force_https = true
  # The Slack Socket Mode connection lives in this process: never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[http_service.checks]]
  # /healthz answers 200 without WEB_TOKEN and returns no data.
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
