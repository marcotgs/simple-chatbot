<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer"><!-- a ?token= URL must never leak via Referer -->
<title>Chatbot</title>
<style>#log p { white-space: pre-wrap; }</style><!-- keep the reply's line breaks (multi-paragraph posts) -->
</head>
<body>
<h1>Chatbot</h1>
<p>
  <button id="new">New session</button>
  Sessions: <span id="sessions"></span>
</p>
<p>Current session: <code id="current">none</code></p>
<div id="log" aria-live="polite"></div>
<form id="form">
  <label for="text">Message</label><br>
  <textarea id="text" rows="3" cols="80" required></textarea><br>
  <button type="submit" id="send">Send</button> <span id="status" role="status"></span>
</form>
<script>
// ?token=... is accepted once: kept in localStorage, sent as a header, removed from the visible URL.
const qs = new URLSearchParams(location.search);
if (qs.has("token")) {
  localStorage.setItem("webToken", qs.get("token"));
  qs.delete("token");
  history.replaceState(null, "", location.pathname + (qs.size ? "?" + qs : "") + location.hash);
}
const token = localStorage.getItem("webToken") || "";
const headers = token ? { "X-Web-Token": token } : {};
const threads = {};   // thread_id -> { messages: [{role, content}], pending: n }
let current = null;

const $ = (id) => document.getElementById(id);

// The server appends this line when a turn produced a validated LinkedIn post.
const DRAFT = /^Open in LinkedIn \(draft\): (\S+)$/m;

// Anchor for the draft link, or null. Only https://www.linkedin.com URLs are ever rendered as links.
function draftLink(content) {
  const m = content.match(DRAFT);
  if (!m) return null;
  let u;
  try { u = new URL(m[1]); } catch { return null; }
  if (!(u.protocol === "https:" && u.hostname === "www.linkedin.com" && !u.port)) return null;
  const a = document.createElement("a");
  a.href = u.href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "Open in LinkedIn (draft)";
  a.title = "Opens LinkedIn in a new tab (nothing is posted) and copies the post text";
  // LinkedIn may drop the text parameter: the click also puts the post on the clipboard.
  const post = u.searchParams.get("text") || "";
  a.onclick = () => { navigator.clipboard?.writeText(post).catch(() => {}); };
  return { a, rest: content.replace(m[0], "").trimEnd() };
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function renderSessions() {
  const box = $("sessions");
  box.replaceChildren();
  for (const id of Object.keys(threads)) {
    const b = document.createElement("button");
    b.textContent = (id === current ? "> " : "") + id.slice(0, 8) + (threads[id].pending ? " (...)" : "");
    b.onclick = () => switchTo(id);
    box.append(b, " ");
  }
}

function render() {
  $("current").textContent = current || "none";
  const log = $("log");
  log.replaceChildren();
  if (current) {
    for (const m of threads[current].messages) {
      const p = document.createElement("p");
      const who = document.createElement("b");
      who.textContent = m.role + ": ";
      const link = m.role === "assistant" ? draftLink(m.content) : null;
      // text nodes and createElement only, never innerHTML
      if (link) p.append(who, link.rest, document.createElement("br"), link.a);
      else p.append(who, m.content);
      log.append(p);
    }
    $("status").textContent = threads[current].pending ? "working\u2026" : "";
  }
  // no double submit while this session waits for a reply
  $("send").disabled = !!(current && threads[current].pending);
  renderSessions();
}

async function switchTo(id) {
  current = id;
  if (!threads[id].loaded) {
    try {
      const h = await api("/history?thread_id=" + encodeURIComponent(id));
      threads[id].messages = h.messages.map(({ role, content }) => ({ role, content }));
      threads[id].loaded = true;
    } catch (e) { $("status").textContent = "error: " + e.message; }
  }
  render();
}

function newSession() {
  const id = crypto.randomUUID();
  threads[id] = { messages: [], pending: 0, loaded: true };
  switchTo(id);
}

$("new").onclick = newSession;

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("text").value.trim();
  if (!text || (current && threads[current].pending)) return;
  if (!current) newSession();
  const id = current;   // reply lands in this session even if the user switches away
  const t = threads[id];
  $("text").value = "";
  t.messages.push({ role: "user", content: text });
  t.pending++;
  render();
  try {
    const r = await api("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: id, text }),
    });
    t.messages.push({ role: "assistant", content: r.reply });
  } catch (e) {
    t.messages.push({ role: "error", content: e.message });
  }
  t.pending--;
  render();
};

(async () => {
  try {
    const { threads: list } = await api("/threads");
    for (const t of list) threads[t.thread_id] = { messages: [], pending: 0, loaded: false };
    if (list.length) await switchTo(list[0].thread_id);
  } catch (e) { $("status").textContent = "error: " + e.message; }
  render();
})();
</script>
</body>
</html>
