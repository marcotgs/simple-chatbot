[project]
name = "simple-chatbot"
version = "0.1.0"
description = "One send() core behind a web chat page and a Slack DM bot, with a per-call input-token budget."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "slack_bolt>=1.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chatbot"]
